<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGCON SEC · CyberSmart</title>
<style>
  :root{
    --navy:#0a1a3a; --navy2:#122552; --navy3:#1a3066;
    --cyan:#00d4ff; --cyan2:#33e0ff;
    --white:#ffffff; --text:#e8f1ff; --muted:#8ba3c7;
    --yellow:#ffd93d; --green:#22c55e; --red:#ef4444;
    --gmail:#ea4335; --outlook:#0078d4; --yahoo:#6001d2;
    --card:#122552; --border:#1f3a72;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#0a1a3a 0%,#06102a 100%);
    color:var(--text);min-height:100vh;padding:16px 16px 120px;
    display:flex;justify-content:center;align-items:flex-start;
    -webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:1080px}
  h1{font-size:1.6rem;font-weight:800;letter-spacing:-.3px;line-height:1.2}
  h2{font-size:1.25rem;font-weight:700;line-height:1.3}
  h3{font-size:1rem;font-weight:700}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .brand-mark{width:42px;height:42px;border-radius:11px;
    background:linear-gradient(135deg,var(--cyan),#0077b6);
    display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;box-shadow:0 4px 18px rgba(0,212,255,.35)}
  .brand-text{line-height:1.15}
  .brand-text .l1{font-size:.7rem;letter-spacing:2px;color:var(--cyan);font-weight:800}
  .brand-text .l2{font-size:1.15rem;font-weight:800;color:var(--white)}
  .sub{color:var(--muted);font-size:.9rem;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.35);margin-bottom:16px}
  .btn{
    background:linear-gradient(135deg,var(--cyan),#0099cc);color:#041028;
    border:0;padding:13px 22px;border-radius:11px;font-size:.95rem;font-weight:800;
    cursor:pointer;transition:.15s;letter-spacing:.2px}
  .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text)}
  .btn.ghost:hover{border-color:var(--cyan);color:var(--cyan)}
  .btn.yellow{background:linear-gradient(135deg,var(--yellow),#ffb800);color:#2a1e00}
  .btn.danger{background:linear-gradient(135deg,var(--red),#b91c1c);color:#fff}
  .btn.block{width:100%;display:block;margin-top:10px}
  .btn.sm{padding:9px 16px;font-size:.85rem}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .center{text-align:center}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .hero{padding:36px 22px;text-align:center}
  .hero .mark-big{width:80px;height:80px;border-radius:22px;margin:0 auto 20px;
    background:linear-gradient(135deg,var(--cyan),#0077b6);
    display:flex;align-items:center;justify-content:center;font-size:2.4rem;
    box-shadow:0 8px 32px rgba(0,212,255,.4)}
  .hero h1{font-size:2rem;margin-bottom:8px;background:linear-gradient(90deg,var(--cyan),#fff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .tag{color:var(--cyan);font-weight:800;letter-spacing:2px;font-size:.8rem;margin-bottom:14px}
  .hero .lede{color:var(--muted);max-width:520px;margin:0 auto 24px;line-height:1.6;font-size:.95rem}
  .mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
  .mode-card{background:var(--navy2);border:1.5px solid var(--border);border-radius:16px;
    padding:22px;cursor:pointer;transition:.15s;text-align:left;position:relative;overflow:hidden}
  .mode-card:hover{border-color:var(--cyan);transform:translateY(-3px);
    box-shadow:0 12px 32px rgba(0,212,255,.15)}
  .mode-card .emoji{font-size:2rem;margin-bottom:10px;display:block}
  .mode-card h3{color:var(--white);margin-bottom:6px}
  .mode-card p{color:var(--muted);font-size:.85rem;line-height:1.5}
  .mode-card .tagline{margin-top:12px;font-size:.7rem;letter-spacing:1px;
    color:var(--cyan);font-weight:800}

  .topbar{display:flex;justify-content:space-between;align-items:center;
    background:var(--navy2);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;margin-bottom:14px;font-size:.85rem;gap:10px;flex-wrap:wrap}
  .topbar .score-pill{background:rgba(0,212,255,.15);color:var(--cyan);
    padding:5px 12px;border-radius:20px;font-weight:800;font-size:1rem}
  .topbar .prog-pill{color:var(--muted)}
  .progress-bar{height:6px;background:var(--navy3);border-radius:3px;overflow:hidden;
    margin-bottom:16px}
  .progress-bar > div{height:100%;background:linear-gradient(90deg,var(--cyan),#0099cc);
    border-radius:3px;transition:width .4s ease}
  .q-cat{display:inline-block;background:rgba(0,212,255,.12);color:var(--cyan);
    padding:4px 10px;border-radius:6px;font-size:.72rem;font-weight:800;letter-spacing:1px;
    text-transform:uppercase;margin-bottom:12px}
  .q-scenario{font-size:1.05rem;line-height:1.55;margin-bottom:20px;color:var(--white)}
  .q-scenario b{color:var(--cyan)}
  .options{display:grid;gap:10px}
  .option{background:var(--navy2);border:1.5px solid var(--border);border-radius:12px;
    padding:14px 16px;cursor:pointer;transition:.12s;text-align:left;color:var(--text);
    font-size:.92rem;line-height:1.45;display:flex;align-items:flex-start;gap:12px}
  .option:hover:not(:disabled){border-color:var(--cyan);background:var(--navy3)}
  .option:disabled{cursor:not-allowed}
  .option .key{width:26px;height:26px;flex-shrink:0;border-radius:7px;
    background:var(--navy3);display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:.8rem;color:var(--cyan)}
  .option.correct{border-color:var(--green);background:rgba(34,197,94,.12)}
  .option.correct .key{background:var(--green);color:#fff}
  .option.wrong{border-color:var(--red);background:rgba(239,68,68,.12)}
  .option.wrong .key{background:var(--red);color:#fff}
  .option.chosen{border-width:2px}

  .feedback-card{border-radius:16px;padding:22px;margin-top:16px;
    border:1.5px solid var(--border);background:var(--card)}
  .feedback-card.good{border-color:var(--green);background:linear-gradient(160deg,#0f2a1c,#122552)}
  .feedback-card.bad{border-color:var(--red);background:linear-gradient(160deg,#2a0f14,#122552)}
  .feedback-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .feedback-head .icon{width:44px;height:44px;border-radius:11px;display:flex;
    align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
  .feedback-card.good .icon{background:var(--green);color:#fff}
  .feedback-card.bad .icon{background:var(--red);color:#fff}
  .feedback-head h3{color:var(--white);font-size:1.15rem}
  .feedback-head .pts{margin-left:auto;font-weight:800;font-size:1rem}
  .feedback-card.good .pts{color:var(--green)}
  .feedback-card.bad .pts{color:var(--red)}
  .fb-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .fb-section .lbl{font-size:.72rem;font-weight:800;letter-spacing:1px;
    color:var(--cyan);text-transform:uppercase;margin-bottom:6px}
  .fb-section p{color:var(--text);font-size:.9rem;line-height:1.55}
  .fb-section.consequence .lbl{color:var(--yellow)}
  .fb-section.didyouknow{background:rgba(0,212,255,.06);padding:12px 14px;
    border-radius:10px;border-top:0;margin-top:14px;border-left:3px solid var(--cyan)}
  .fb-section.didyouknow .lbl{color:var(--cyan)}
  .fb-section.didyouknow p{font-size:.85rem;color:var(--muted)}

  .results-hero{text-align:center;padding:30px 20px}
  .rank-badge{display:inline-block;padding:8px 20px;border-radius:30px;
    background:linear-gradient(135deg,var(--cyan),#0077b6);color:#041028;
    font-weight:800;font-size:.9rem;letter-spacing:1px;margin-bottom:16px}
  .big-score{font-size:3.5rem;font-weight:900;line-height:1;
    background:linear-gradient(90deg,var(--cyan),#fff);
    -webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:12px;margin:20px 0}
  .stat{background:var(--navy2);border:1px solid var(--border);border-radius:12px;
    padding:14px;text-align:center}
  .stat .num{font-size:1.6rem;font-weight:900;color:var(--cyan)}
  .stat .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;
    letter-spacing:.5px;margin-top:4px}

  .modal-bg{position:fixed;inset:0;background:rgba(4,8,20,.88);
    backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:300;animation:fade .2s}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:28px;max-width:560px;width:100%;max-height:90vh;overflow:auto;
    box-shadow:0 30px 80px rgba(0,0,0,.7)}
  .modal h2{color:var(--white);margin-bottom:10px}
  .modal p{color:var(--muted);line-height:1.6;font-size:.9rem;margin-bottom:12px}

  .mail-shell{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;margin-top:14px}
  @media(max-width:860px){.mail-shell{grid-template-columns:1fr}}
  .inbox{background:#fff;color:#202124;border-radius:14px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);align-self:start}
  .inbox-head{padding:12px 18px;color:#fff;display:flex;justify-content:space-between;
    align-items:center;font-weight:700;font-size:.95rem}
  .inbox.gmail .inbox-head{background:var(--gmail)}
  .inbox.outlook .inbox-head{background:var(--outlook)}
  .inbox.yahoo .inbox-head{background:var(--yahoo)}
  .inbox-tools{background:#f6f8fc;padding:8px 18px;display:flex;gap:6px;
    border-bottom:1px solid #e0e0e0;font-size:.72rem;color:#5f6368;flex-wrap:wrap}
  .inbox-tools span{padding:3px 8px;border-radius:5px;background:#fff;border:1px solid #e0e0e0}
  .email{display:flex;align-items:center;gap:10px;padding:11px 14px;
    border-bottom:1px solid #f0f0f0;cursor:pointer;transition:.1s;position:relative}
  .email:hover{background:#f5f8ff}
  .email.sel{background:#e8f0fe;border-left:3px solid #1a73e8;padding-left:11px}
  .email.answered{opacity:.45;pointer-events:none}
  .email .avatar{width:34px;height:34px;border-radius:50%;background:#dfe3ee;color:#3c4043;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem;flex-shrink:0}
  .email .meta{flex:1;min-width:0}
  .email .who{font-weight:700;font-size:.82rem;color:#202124;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .email .subj{font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#5f6368}
  .email.unread .subj{font-weight:700;color:#202124}
  .email .time{font-size:.68rem;color:#5f6368;white-space:nowrap;align-self:flex-start;padding-top:2px}
  .preview{background:#fff;color:#202124;border-radius:14px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;
    min-height:400px;align-self:start}
  .preview.empty{align-items:center;justify-content:center;color:#8b93b8;text-align:center;padding:40px}
  .preview-empty-icon{font-size:2.6rem;margin-bottom:10px;opacity:.6}
  .preview-head{padding:14px 20px;border-bottom:1px solid #eee;background:#f9fafd}
  .preview-head h3{font-size:.98rem;color:#202124;margin-bottom:5px;line-height:1.3}
  .preview-head .addr{font-size:.78rem;color:#5f6368;line-height:1.5;word-break:break-word}
  .preview-head .addr b{color:#202124}
  .preview-head .date{font-size:.72rem;color:#8b93b8;margin-top:5px}
  .preview-body{padding:16px 20px;font-size:.85rem;line-height:1.6;flex:1;
    white-space:pre-line;color:#3c4043;word-break:break-word}
  .preview-meta{padding:10px 20px;background:#f6f8fc;border-top:1px solid #eee;
    font-size:.74rem;color:#5f6368}
  .preview-meta b{color:#202124}
  .link-note{background:#fff8e1;border-left:3px solid #ffcc4d;padding:7px 11px;
    font-size:.74rem;color:#7a5c00;margin:0 20px 10px;border-radius:4px;word-break:break-word}
  .preview-actions{padding:12px 20px;border-top:1px solid #eee;display:flex;
    justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
  .preview-actions .msg{font-size:.74rem;color:#8b93b8}

  .banner-wrap{position:fixed;left:0;right:0;bottom:0;padding:0 14px 14px;
    display:flex;justify-content:center;z-index:150;pointer-events:none}
  .banner{pointer-events:auto;width:100%;max-width:1080px;background:#fff;color:#0a1a3a;
    border-radius:14px;box-shadow:0 -8px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(0,212,255,.4);
    padding:14px 18px;display:flex;gap:14px;align-items:center;
    animation:bannerIn .35s ease;position:relative;overflow:hidden}
  @keyframes bannerIn{from{transform:translateY(120%);opacity:0}to{transform:none;opacity:1}}
  .banner.out{animation:bannerOut .3s ease forwards}
  @keyframes bannerOut{to{transform:translateY(120%);opacity:0}}
  .banner .icon{width:48px;height:48px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:1.5rem;
    background:linear-gradient(135deg,var(--cyan),#0077b6);color:#041028}
  .banner .content{flex:1;min-width:0}
  .banner .name{font-size:.68rem;font-weight:900;letter-spacing:1.5px;
    color:#0077b6;text-transform:uppercase;margin-bottom:3px}
  .banner .msg{font-size:.88rem;line-height:1.5;color:#0a1a3a}
  .banner .msg b{color:#0077b6}
  .banner .close{position:absolute;top:8px;right:12px;cursor:pointer;
    font-size:1.1rem;color:#999;font-weight:800;line-height:1;
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    border-radius:6px;transition:.1s}
  .banner .close:hover{background:#eee;color:#333}
  .banner .timer{position:absolute;left:0;bottom:0;height:3px;background:var(--cyan);
    width:100%;transform-origin:left;animation:drain 15s linear forwards}
  @keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .banner.silent{background:var(--navy2);color:var(--text);
    box-shadow:0 -8px 40px rgba(0,0,0,.6),0 0 0 1px rgba(139,163,199,.4)}
  .banner.silent .icon{background:var(--navy3);color:var(--muted)}
  .banner.silent .name{color:var(--cyan)}
  .banner.silent .msg{color:var(--text)}
  .banner.silent .msg b{color:var(--cyan)}
  .banner.bad-banner{background:#2a0f14;color:#ffd9e0;
    box-shadow:0 -8px 40px rgba(0,0,0,.6),0 0 0 1px rgba(239,68,68,.6)}
  .banner.bad-banner .icon{background:linear-gradient(135deg,var(--red),#b91c1c)}
  .banner.bad-banner .name{color:#ff8fa3}
  .banner.bad-banner .msg{color:#ffd9e0}
  .banner.bad-banner .msg b{color:#ff8fa3}

  .pill{display:inline-block;padding:4px 10px;border-radius:20px;
    background:rgba(0,212,255,.12);color:var(--cyan);font-size:.72rem;font-weight:800}
  .divider{height:1px;background:var(--border);margin:16px 0}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .list-plain{list-style:none;color:var(--muted);font-size:.85rem;line-height:1.7}
  .list-plain li{padding-left:18px;position:relative}
  .list-plain li::before{content:"→";position:absolute;left:0;color:var(--cyan);font-weight:800}
  @media(max-width:600px){
    body{padding:10px 10px 130px}
    .hero h1{font-size:1.6rem}
    .banner-wrap{padding:0 8px 10px}
    .banner{padding:11px 13px;gap:10px}
    .banner .icon{width:40px;height:40px;font-size:1.2rem}
    .banner .msg{font-size:.82rem}
    .modal{padding:22px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="brand-mark">🛡️</div>
    <div class="brand-text">
      <div class="l1">DIGCON SEC</div>
      <div class="l2">CyberSmart</div>
    </div>
  </div>
  <div id="screen"></div>
</div>
<div class="banner-wrap" id="bannerWrap"></div>

<script>
/* ==========================================================
   DATA — SCENARIOS
   ========================================================== */
const MODES = {
  phishing: {
    id:'phishing', title:'Phishing Detective',
    tagline:'Read the inbox. Find the phish.',
    emoji:'🕵️',
    desc:'An inbox appears. One email is trying to hack you. Read carefully, then mark the phish. Wrong picks cost points.',

  },
  everyday: {
    id:'everyday', title:'Everyday Cyber Safety',
    tagline:'10 random real-life scenarios',
    emoji:'🌍',
    desc:'Situations from daily life: messages, calls, giveaways, account alerts, shopping. What should you do?',
    color:'#22c55e'
  },
  family: {
    id:'family', title:'Family Protector',
    tagline:'Protect the people you love',
    emoji:'👨‍👩‍👧‍👦',
    desc:'Your mother gets a fake bank call. Your child is contacted by a stranger. Your sibling gets a suspicious link. How do you protect them?',
    color:'#ffd93d'
  },
  business: {
    id:'business', title:'Business Defender',
    tagline:'Small business, serious risks',
    emoji:'🏪',
    desc:'Fake transfer receipts, stolen laptops, employee mistakes, supplier scams. Protect your shop.',
    color:'#a06bff'
  },
  spot: {
    id:'spot', title:'Spot the Danger',
    tagline:'Identify suspicious signs',
    emoji:'🔎',
    desc:'Fake bank messages, suspicious links, fake recruiters. Read the content and identify what\'s wrong.',
    color:'#00d4ff'
  },
  decide: {
    id:'decide', title:'What Would You Do?',
    tagline:'Real incidents. Real decisions.',
    emoji:'💡',
    desc:'You lost your phone. Your computer says it\'s encrypted. A friend needs urgent money. What now?',
    color:'#22c55e'
  }
};

const SCENARIOS = [];

// ============ EVERYDAY CYBER SAFETY ============
const EVERYDAY = [
  {id:'EV-001', mode:'everyday', category:'Banking & Finance', attack:'Phishing', difficulty:'Beginner',
   scenario:'Your phone buzzes. A text message says: "UBA ALERT: Your account will be BLOCKED in 24 hours. Verify now: ubagroup-secure.com/verify."',
   question:'What should you do?',
   options:['Tap the link and enter your details quickly','Reply STOP to the message','Ignore the link. Open your bank app or call the official bank number to check.','Forward it to friends so they are warned'],
   correctAnswer:2,
   explanation:'Banks do not block accounts through random links in SMS. The link goes to a fake site that will steal your password and OTP.',
   lesson:'Always open your bank app directly or use the official phone number printed on your card.',
   consequence:'Your account could be emptied within minutes of entering your details.',
   didYouKnow:'Bank SMS alerts never ask you to click a link to "verify" your account. That is a classic phishing move.',
   points:10},
  {id:'EV-002', mode:'everyday', category:'Personal Cyber Safety', attack:'OTP theft', difficulty:'Beginner',
   scenario:'A man calls and says he is from "Customer Care". He knows your name and asks for the 6-digit OTP sent to your phone to "reverse a wrong transfer".',
   question:'What should you do?',
   options:['Give him the OTP since he knows your name','Give him a fake OTP','Hang up. Never share your OTP with anyone — not even a "bank official".','Send him a screenshot of the SMS'],
   correctAnswer:2,
   explanation:'Banks will NEVER ask for your OTP over the phone. The caller is trying to approve a transaction on your account.',
   lesson:'Treat your OTP like your ATM PIN. If someone asks for it, it is a scam.',
   consequence:'Once the OTP is shared, the attacker can approve transactions and empty your account.',
   didYouKnow:'OTP means "One-Time Password." It is the second lock on your account — sharing it is like giving someone your PIN.',
   points:10},
  {id:'EV-003', mode:'everyday', category:'Social Media', attack:'Giveaway scam', difficulty:'Beginner',
   scenario:'On WhatsApp you receive: "Congratulations! You have won a brand-new iPhone from a promo. Click this link and share with 20 contacts to claim."',
   question:'What should you do?',
   options:['Click the link — it is a real promo','Share with 20 friends to claim your prize','Ignore and delete. Real promos never require you to share with contacts or click unsolicited links.','Reply asking for more details first'],
   correctAnswer:2,
   explanation:'You did not enter any promo — so you cannot win it. This is a mass-shared scam. Clicking can install malware or steal your account.',
   lesson:'If you did not enter, you did not win. Real brands announce winners through official pages.',
   consequence:'Your WhatsApp account could be hijacked and used to scam your contacts.',
   didYouKnow:'Fake giveaways are among the most-shared scams on WhatsApp — they spread because friends share them.',
   points:10},
  {id:'EV-004', mode:'everyday', category:'Personal Cyber Safety', attack:'Account alert', difficulty:'Beginner',
   scenario:'An email says: "Your Netflix payment failed. Update your card within 24 hours or your account will be suspended." The sender is info@netflix-billing-support.com.',
   question:'What should you do?',
   options:['Click the link and update your card','Reply with your card details','Open the Netflix app or type netflix.com yourself to check — the email is fake.','Ignore it for a week'],
   correctAnswer:2,

/* BANNER */
function showBanner({type='hint', name='DIGCON SEC', text='', icon='🛡️', autoDismissMs=15000}){
  clearBanner();
  const wrap = document.createElement('div');
  wrap.className = 'banner ' +
    (type==='hint-silent'?'silent': type==='bad'?'bad-banner': '');
  wrap.innerHTML = `
    <div class="icon">${icon}</div>
    <div class="content">
      <div class="name">${name}</div>
      <div class="msg">${text}</div>
    </div>
    <span class="close" title="Dismiss">×</span>
    <div class="timer"></div>
  `;
  bannerWrap.appendChild(wrap);
  const close = ()=>{
    if(wrap.classList.contains('out')) return;
    wrap.classList.add('out');
    setTimeout(()=>{ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 300);
  };
  wrap.querySelector('.close').onclick = close;
  const timerEl = wrap.querySelector('.timer');
  if(autoDismissMs > 0){
    timerEl.style.animationDuration = (autoDismissMs/1000)+'s';
    setTimeout(close, autoDismissMs);
  } else timerEl.remove();
}
function clearBanner(){ bannerWrap.innerHTML = ''; }

function startHintLoop(){
  stopHintLoop();
  setTimeout(()=>{ if(state.hints.text || state.hints.silent) showHintNow(); }, 400);
  state.hints.timer = setInterval(()=>{
    if(state.answerLocked) return;
    if(!state.hints.text && !state.hints.silent) return;
    if(document.querySelector('.banner')) return;
    showHintNow();
  }, 15000);
}
function stopHintLoop(){
  if(state.hints.timer){ clearInterval(state.hints.timer); state.hints.timer = null; }
}
function showHintNow(){
  if(state.hints.silent){
    showBanner({ type:'hint-silent', name:'Defender', icon:'😶',
      text:`…Defender has gone quiet. You're on your own this time.`, autoDismissMs:15000 });
  } else if(state.hints.text){
    showBanner({ type:'hint', name:'Defender', icon:'🛡️',
      text:state.hints.text, autoDismissMs:15000 });
  }
}

      <p class="lede">Every day, we make decisions that protect or expose us online. Pick any of the six games below and see how cyber-smart you are.</p>
    </div>

    <div class="card">
      <div class="flex-between" style="margin-bottom:6px">
        <h2>Choose a game</h2>
        <span class="pill">6 games</span>
      </div>
      <div class="mode-grid" style="margin-top:16px">
        <div class="mode-card" data-mode="phishing">
          <span class="emoji">🕵️</span>
          <h3>Phishing Detective</h3>
          <p>${MODES.phishing.desc}</p>
          <div class="tagline">5 LEVELS · INBOX SIMULATION</div>
        </div>
        <div class="mode-card" data-mode="everyday">
          <span class="emoji">🌍</span>
          <h3>Everyday Cyber Safety</h3>
          <p>${MODES.everyday.desc}</p>
          <div class="tagline">10 RANDOM SCENARIOS</div>
        </div>
        <div class="mode-card" data-mode="family">
          <span class="emoji">👨‍👩‍👧‍👦</span>
          <h3>Family Protector</h3>
          <p>${MODES.family.desc}</p>
          <div class="tagline">PROTECT YOUR LOVED ONES</div>
        </div>
        <div class="mode-card" data-mode="business">
          <span class="emoji">🏪</span>
          <h3>Business Defender</h3>
          <p>${MODES.business.desc}</p>
          <div class="tagline">SMALL BUSINESS · BIG RISKS</div>
        </div>
        <div class="mode-card" data-mode="spot">
          <span class="emoji">🔎</span>
          <h3>Spot the Danger</h3>
          <p>${MODES.spot.desc}</p>
          <div class="tagline">IDENTIFY SUSPICIOUS SIGNS</div>
        </div>
        <div class="mode-card" data-mode="decide">
          <span class="emoji">💡</span>
          <h3>What Would You Do?</h3>
          <p>${MODES.decide.desc}</p>
          <div class="tagline">REAL INCIDENTS · REAL DECISIONS</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:10px">How it works</h3>
      <ul class="list-plain">
        <li>Choose a game to start a fresh round of questions.</li>
        <li>Correct answers earn points. Wrong answers cost 10% of the question's points.</li>
        <li>Feedback appears immediately after every answer — why it is safe or unsafe, what could happen, what to do next.</li>
        <li>Finish the round to get your rank, accuracy, and category breakdown.</li>
      </ul>
    </div>
  `;
  screen.querySelectorAll('[data-mode]').forEach(c=>{
    c.onclick = ()=> startMode(c.dataset.mode);
  });
}

function startMode(mode){
  if(mode==='phishing'){ startPhishingSetup(); return; }
  const bank = SCENARIOS.filter(s=>s.mode===mode);
  if(bank.length === 0){ alert('No questions for this mode.'); return; }
  const set = shuffle(bank).slice(0, Math.min(10, bank.length));
  state.mode = mode;
  state.csQuestions = set;
  state.csIndex = 0;
  state.csCorrect = 0;
  state.csWrong = 0;
  state.csHistory = [];
  state.score = 0;
  state.streak = 0;
  state.csSessionStart = Date.now();
  state.screen = 'quiz';
  renderQuestion();
}

/* QUIZ */
function renderQuestion(){
  stopHintLoop(); clearBanner();
  const q = state.csQuestions[state.csIndex];
  const total = state.csQuestions.length;
  const displayed = shuffle([0,1,2,3]);
  state._displayed = displayed;
  state._answered = false;

  screen.innerHTML = `
    <div class="topbar">
      <span class="prog-pill">Question <b>${state.csIndex+1}</b> of <b>${total}</b> · ${MODES[state.mode].title}</span>
      <span class="score-pill">${state.score} pts</span>
    </div>
    <div class="progress-bar"><div style="width:${(state.csIndex/total)*100}%"></div></div>

    <div class="card fade">
      <span class="q-cat">${q.category}</span>
      <div class="q-scenario">${q.scenario}</div>
      <h3 style="margin-bottom:10px">${q.question}</h3>
      <div class="options" id="options">
        ${displayed.map((orig,pos)=>`
          <button class="option" data-orig="${orig}" data-pos="${pos}">
            <span class="key">${'ABCD'[pos]}</span>
            <span>${q.options[orig]}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
  screen.querySelectorAll('.option').forEach(btn=>{
    btn.onclick = ()=> answerQuestion(parseInt(btn.dataset.orig), btn);
  });
}

function answerQuestion(origIdx, btnEl){
  if(state._answered) return;
  state._answered = true;
  const q = state.csQuestions[state.csIndex];
  const correct = origIdx === q.correctAnswer;
  const penalty = Math.round(q.points * 0.10);

  screen.querySelectorAll('.option').forEach(btn=>{
    btn.disabled = true;
    const oi = parseInt(btn.dataset.orig);
    if(oi === q.correctAnswer) btn.classList.add('correct');
    if(btn === btnEl && !correct) btn.classList.add('wrong','chosen');
    if(btn === btnEl && correct) btn.classList.add('chosen');
  });

  if(correct){ state.score += q.points; state.streak++; state.csCorrect++; }
  else { state.score = Math.max(0, state.score - penalty); state.streak = 0; state.csWrong++; }
  state.csHistory.push({ id:q.id, correct, chosen:origIdx, correctAnswer:q.correctAnswer });

  const fb = document.createElement('div');
  fb.className = 'feedback-card ' + (correct?'good':'bad');
  fb.innerHTML = `
    <div class="feedback-head">
      <div class="icon">${correct?'✓':'!'}</div>
      <h3>${correct ? 'Excellent decision!' : 'Not quite — let\'s learn from this.'}</h3>
      <div class="pts">${correct?'+'+q.points : '−'+penalty} pts</div>
    </div>
    <div class="fb-section"><div class="lbl">Why</div><p>${q.explanation}</p></div>
    <div class="fb-section"><div class="lbl">What to do</div><p>${q.lesson}</p></div>
    <div class="fb-section consequence"><div class="lbl">What could happen</div><p>${q.consequence}</p></div>
    ${q.didYouKnow ? `<div class="fb-section didyouknow"><div class="lbl">Did you know?</div><p>${q.didYouKnow}</p></div>` : ''}
    <button class="btn block" id="nextBtn">${state.csIndex+1 === state.csQuestions.length ? 'See Results →' : 'Continue →'}</button>
  `;
  screen.querySelector('.card').appendChild(fb);
  fb.scrollIntoView({behavior:'smooth', block:'start'});
  document.getElementById('nextBtn').onclick = ()=>{
    state.csIndex++;
    if(state.csIndex >= state.csQuestions.length){ renderResults(); }
    else renderQuestion();
  };
}

/* RESULTS */
function renderResults(){
  stopHintLoop(); clearBanner();
  const total = state.csQuestions.length;
  const pct = total ? Math.round((state.csCorrect/total)*100) : 0;
  const rank = pct>=91 ? 'Cyber Champion' : pct>=71 ? 'Cyber Guardian' : pct>=51 ? 'Cyber Aware' : pct>=31 ? 'Digital Explorer' : 'Cyber Beginner';
  const rankEmoji = pct>=91 ? '🏆' : pct>=71 ? '🥇' : pct>=51 ? '🥈' : pct>=31 ? '🥉' : '🌱';

  const byCat = {};
  state.csQuestions.forEach(q=>{
    const h = state.csHistory.find(x=>x.id===q.id);
    if(!h) return;
    byCat[q.category] = byCat[q.category] || { total:0, correct:0 };
    byCat[q.category].total++;
    if(h.correct) byCat[q.category].correct++;
  });

  try{
    const prev = JSON.parse(localStorage.getItem('digcon_cybersmart_scores')||'[]');
    prev.push({ score: state.score, pct, total, date: new Date().toISOString() });
    localStorage.setItem('digcon_cybersmart_scores', JSON.stringify(prev.slice(-20)));
  }catch(e){}

  screen.innerHTML = `
    <div class="card results-hero fade">
      <div class="rank-badge">${rankEmoji} ${rank}</div>
      <div class="big-score">${pct}%</div>
      <p class="sub">${state.csCorrect} of ${total} correct</p>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="num">${state.score}</div><div class="lbl">Points</div></div>
      <div class="stat"><div class="num" style="color:var(--green)">${state.csCorrect}</div><div class="lbl">Correct</div></div>
      <div class="stat"><div class="num" style="color:var(--red)">${state.csWrong}</div><div class="lbl">Incorrect</div></div>
      <div class="stat"><div class="num">${MODES[state.mode].emoji}</div><div class="lbl">${MODES[state.mode].title}</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px">Performance by category</h3>
      ${Object.entries(byCat).map(([cat, v])=>{
        const p = Math.round((v.correct/v.total)*100);
        return `<div style="margin-bottom:10px">
          <div class="flex-between" style="font-size:.85rem"><span>${cat}</span><b>${v.correct}/${v.total}</b></div>
          <div class="progress-bar" style="height:4px;margin:4px 0 0"><div style="width:${p}%"></div></div>
        </div>`;
      }).join('') || '<p class="sub">No data.</p>'}
    </div>
    <div class="card">
      <div class="row">
        <button class="btn" id="againBtn">Play Again</button>
        <button class="btn ghost" id="anotherBtn">Choose Another Game</button>
        <button class="btn ghost" id="homeBtn">Return Home</button>
      </div>
    </div>
  `;
  document.getElementById('againBtn').onclick = ()=>startMode(state.mode);
  document.getElementById('anotherBtn').onclick = ()=>renderHome();
  document.getElementById('homeBtn').onclick = ()=>renderHome();
}

/* PHISHING */
function startPhishingSetup(){
  stopHintLoop(); clearBanner();
  state.phishingLevels = genPhishingLevels();
  state.screen = 'phishing-setup';
  screen.innerHTML = `
    <div class="card fade">
      <h2 style="margin-bottom:6px">Choose your email provider</h2>
      <p class="sub" style="margin-bottom:0">The inbox will look like your real one — because that's how phishing works.</p>
      <div class="mode-grid" style="margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
        <div class="mode-card" data-p="gmail" style="text-align:center;padding:22px">
          <div style="font-size:1.6rem;font-weight:900;color:var(--gmail);margin-bottom:4px">Gmail</div>
          <small style="color:var(--muted)">Google</small>
        </div>
        <div class="mode-card" data-p="outlook" style="text-align:center;padding:22px">
          <div style="font-size:1.6rem;font-weight:900;color:var(--outlook);margin-bottom:4px">Outlook</div>
          <small style="color:var(--muted)">Microsoft</small>
        </div>
        <div class="mode-card" data-p="yahoo" style="text-align:center;padding:22px">
          <div style="font-size:1.6rem;font-weight:900;color:var(--yahoo);margin-bottom:4px">Yahoo</div>
          <small style="color:var(--muted)">Mail</small>
        </div>
      </div>
      <div style="margin-top:24px" class="center">
        <button class="btn" id="beginBtn" disabled>Begin Investigation →</button>
      </div>
    </div>
  `;
  screen.querySelectorAll('[data-p]').forEach(el=>{
    el.onclick = ()=>{
      screen.querySelectorAll('[data-p]').forEach(x=>x.style.borderColor='');
      el.style.borderColor = 'var(--cyan)';
      state.provider = el.dataset.p;
      document.getElementById('beginBtn').disabled = false;
    };
  });
  document.getElementById('beginBtn').onclick = ()=>{
    state.score = 0; state.level = 0; state.streak = 0;
    state.startTime = Date.now();
    state.screen = 'phishing';
    startPhishingLevel();
  };
}

function startPhishingLevel(){
  if(state.level >= state.phishingLevels.length){ renderPhishingResults(); return; }
  state._phishAnswered = false;
  const lvl = state.phishingLevels[state.level];
  state.currentEmails = shuffle(lvl.emails);
  state.selectedIdx = null;
  state.answerLocked = false;
  state.levelStart = Date.now();
  state.hints.text = lvl.defender || null;
  state.hints.silent = !lvl.defender;

  const brand = state.provider==='gmail'?'Gmail':state.provider==='outlook'?'Outlook':'Yahoo Mail';

  screen.innerHTML = `
    <div class="topbar">
      <span class="prog-pill">Level <b>${state.level+1}</b> of ${state.phishingLevels.length} · Streak ${state.streak}</span>
      <span class="score-pill">${state.score} pts</span>
    </div>
    <div class="progress-bar"><div style="width:${(state.level/state.phishingLevels.length)*100}%"></div></div>
    <div class="card fade">
      <span class="q-cat">Level ${state.level+1}</span>
      <h2 style="margin-bottom:4px">${lvl.title}</h2>
      <p class="sub" style="margin-bottom:0">Click any email to read it, then use the preview to mark the phish. Wrong = −10 pts, try another.</p>
      <div class="mail-shell">
        <div class="inbox ${state.provider}">
          <div class="inbox-head"><span>${brand}</span><span>Inbox (${state.currentEmails.length})</span></div>
          <div class="inbox-tools"><span>📥 Inbox</span><span>⭐ Starred</span><span>📤 Sent</span><span>🗑️ Trash</span></div>
          ${state.currentEmails.map((e,i)=>`
            <div class="email unread" data-i="${i}">
              <div class="avatar">${e.av||e.from[0]}</div>
              <div class="meta"><div class="who">${e.from}</div><div class="subj">${e.subj}</div></div>
              <div class="time">${e.time}</div>
            </div>
          `).join('')}
        </div>
        <div class="preview empty" id="preview">
          <div class="preview-empty-icon">📩</div>
          <div>Select an email to view it here</div>
        </div>
      </div>
    </div>
  `;
  screen.querySelectorAll('.email').forEach(el=>{
    el.onclick = ()=> selectEmail(parseInt(el.dataset.i));
  });
  if(window.innerWidth <= 860 && state.currentEmails.length) selectEmail(0);
  startHintLoop();
}

function selectEmail(i){
  if(state._phishAnswered) return;
  const e = state.currentEmails[i];
  if(e._answered) return;
  state.selectedIdx = i;
  screen.querySelectorAll('.email').forEach((el,idx)=>{
    el.classList.toggle('sel', idx === i);
    if(idx === i) el.classList.remove('unread');
  });

  const attachHtml = e.attachments && e.attachments.length
    ? `<div class="preview-meta">📎 <b>Attachments:</b> ${e.attachments.map(a=>`${a.name} <span style="color:#8b93b8">(${a.size})</span>`).join(' · ')}</div>`
    : '';
  const linksHtml = e.links && e.links.length
    ? `<div class="link-note">🔗 Link: <b>${e.links[0].text}</b> — actual: <b>${e.links[0].real}</b></div>`
    : '';

  document.getElementById('preview').classList.remove('empty');
  document.getElementById('preview').innerHTML = `
    <div class="preview-head">
      <h3>${e.subj}</h3>
      <div class="addr"><b>${e.from}</b> &lt;${e.addr}&gt;</div>
      <div class="addr">To: <b>${e.to}</b></div>
      <div class="date">${e.date}</div>
    </div>
    <div class="preview-body">${e.body}</div>
    ${linksHtml}
    ${attachHtml}
    <div class="preview-actions">
      <span class="msg">Is this email safe or a phish?</span>
      <div>
        <button class="btn ghost sm" id="safeBtn">✅ It's safe</button>
        <button class="btn danger sm" id="phishBtn">🎣 Mark as phish</button>
      </div>
    </div>
  `;
  document.getElementById('safeBtn').onclick = ()=> submitPhish(false);
  document.getElementById('phishBtn').onclick = ()=> submitPhish(true);
}

function submitPhish(playerThinksPhish){
  if(state._phishAnswered) return;
  const e = state.currentEmails[state.selectedIdx];
  if(!e || e._answered) return;
  const actuallyEvil = e.evil;
  const playerCorrect = playerThinksPhish === actuallyEvil;

  if(playerCorrect){
    state._phishAnswered = true;
    stopHintLoop();
    const timeTaken = (Date.now()-state.levelStart)/1000;
    const timeBonus = Math.max(0, Math.round(50 - timeTaken));
    const streakBonus = state.streak * 15;
    const pts = 100 + timeBonus + streakBonus;
    state.score += pts;
    state.streak++;
    state.level++;
    clearBanner();
    showPhishResult(e, pts, timeBonus, streakBonus);
  } else {
    const penalty = 10;
    state.score = Math.max(0, state.score - penalty);
    state.streak = 0;
    e._answered = true;
    const emailEl = screen.querySelector(`.email[data-i="${state.selectedIdx}"]`);
    if(emailEl) emailEl.classList.add('answered');
    const preview = document.getElementById('preview');
    const note = document.createElement('div');
    note.className = 'link-note';
    note.style.background = actuallyEvil ? '#ffebee' : '#e8f5e9';
    note.style.color = actuallyEvil ? '#8a1c1c' : '#1b5e20';
    note.style.borderLeftColor = actuallyEvil ? '#c62828' : '#2e7d32';
    note.innerHTML = actuallyEvil
      ? `🚨 <b>This email IS a phish.</b> You marked it safe.`
      : `✅ <b>This email is safe.</b> You flagged a legit email.`;
    const actions = preview.querySelector('.preview-actions');
    if(actions) actions.remove();
    preview.appendChild(note);
    state.selectedIdx = null;
    const text = actuallyEvil
      ? `<b>You marked a phishing email as safe.</b> That one is malicious. <b>−${penalty} pts.</b> Check sender domain + hover the link. Try another.`
      : `<b>You flagged a legit email.</b> This one is actually safe. <b>−${penalty} pts.</b> False positives waste time. Try another.`;
    showBanner({ type:'bad', name:'Wrong call', icon:'❌', text, autoDismissMs:15000 });
  }
}

function showPhishResult(email, pts, timeBonus, streakBonus){
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal fade">
      <h2 style="color:var(--green)">✅ Nice catch, Detective!</h2>
      <p>You correctly identified the phishing attempt.</p>
      <div style="background:var(--navy3);padding:14px;border-radius:10px;margin-bottom:14px;font-size:.9rem">
        <div class="flex-between"><span>Base</span><b>+100</b></div>
        <div class="flex-between"><span>Speed</span><b>+${timeBonus}</b></div>
        <div class="flex-between"><span>Streak (${state.streak})</span><b>+${streakBonus}</b></div>
        <div class="divider"></div>
        <div class="flex-between"><b>Level total</b><b style="color:var(--green)">+${pts}</b></div>
      </div>
      <div style="background:rgba(255,217,61,.08);border-left:3px solid var(--yellow);padding:12px 14px;border-radius:8px;font-size:.85rem;color:var(--text);line-height:1.6">
        <b style="color:var(--yellow)">Red flags:</b><br>
        ${email.why.map(w=>`• ${w}`).join('<br>')}
      </div>
      <button class="btn block" id="nextBtn" style="margin-top:16px">${state.level>=state.phishingLevels.length?'See Results →':'Next Level →'}</button>
    </div>
  `;
  document.body.appendChild(modal);
  modal.querySelector('#nextBtn').onclick = ()=>{
    modal.remove();
    if(state.level>=state.phishingLevels.length) renderPhishingResults();
    else startPhishingLevel();
  };
}

function renderPhishingResults(){
  stopHintLoop(); clearBanner();
  const total = state.phishingLevels.length;
  const correct = state.level;
  const pct = Math.round((correct/total)*100);
  const rank = pct>=100?'🏆 Elite Cyber Detective': pct>=80?'🥇 Sharp Detective': pct>=60?'🥈 Certified Detective':'🥉 Trainee';
  try{
    const prev = JSON.parse(localStorage.getItem('digcon_phishing_scores')||'[]');
    prev.push({score:state.score, pct, date:new Date().toISOString()});
    localStorage.setItem('digcon_phishing_scores', JSON.stringify(prev.slice(-20)));
  }catch(e){}
  screen.innerHTML = `
    <div class="card results-hero fade">
      <div class="rank-badge">${rank}</div>
      <div class="big-score">${state.score}</div>
      <p class="sub">${correct} of ${total} levels cleared</p>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="num">${correct}</div><div class="lbl">Levels Cleared</div></div>
      <div class="stat"><div class="num">${state.streak}</div><div class="lbl">Final Streak</div></div>
      <div class="stat"><div class="num">${pct}%</div><div class="lbl">Accuracy</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:10px">What you learned</h3>
      <ul class="list-plain">
        <li>Always check the real sender domain — display names are easy to fake.</li>
        <li>Hover over links to preview the actual destination.</li>
        <li>Never open unexpected <b>.exe</b> or <b>.zip</b> attachments.</li>
        <li>Urgent threats ("24 hours to act") are phishing pressure tactics.</li>
        <li>Gift-card requests are always a scam, even if the "CEO" asks.</li>
      </ul>
    </div>
    <div class="card">
      <div class="row">
        <button class="btn" id="againBtn">Play Again</button>
        <button class="btn ghost" id="homeBtn">Return Home</button>
      </div>
    </div>
  `;
  document.getElementById('againBtn').onclick = ()=>startPhishingSetup();
  document.getElementById('homeBtn').onclick = ()=>renderHome();
}

renderHome();
</script>
</body>
</html>
